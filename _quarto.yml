project:
  type: website
  render:
    - "*.qmd"
    - "!products.qmd"
    - "!customers.qmd"
    - "!employees.qmd"

website:
  title: "Pine Straw Distributors LLC"
  announcement:
    dismissable: false
    content: "For current prices, email us at [sales@pinestrawdistributors.com](mailto:sales@pinestrawdistributors.com) or call 1-800-xxx-xxxx"
    type: success
    position: below-navbar
  navbar:
    logo: img/logo.svg
    logo-alt: "Pine Straw Distributors LLC logo — three pine straw bales"
    left:
      - href: index.qmd
        text: Home
      - href: contact.qmd
        text: Contact

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    include-in-header: _head.html
    include-after-body: _footer.html
    mainfont: "Atkinson Hyperlegible"
